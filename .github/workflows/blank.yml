name: build-omnivoice-tts
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Ambil kode omnivoice.cpp (revisi yang sama dengan VoiceStudio)
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/ServeurpersoCom/omnivoice.cpp.git src
          cd src
          git checkout 886fc079838ca7400cb2b42b36e2a65aa1daabe8
          git submodule update --init --recursive
      - name: Build (CPU, kompatibel AVX2)
        shell: pwsh
        working-directory: src
        run: |
          cmake -B build -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build build --config Release -j 4
      - name: Kumpulkan hasil
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/build -Recurse -Filter omnivoice-tts.exe | Select-Object -First 1
          if (-not $exe) { throw "omnivoice-tts.exe tidak ditemukan setelah build" }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item $exe.FullName out/
          Get-ChildItem $exe.DirectoryName -Filter *.dll | Copy-Item -Destination out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: omnivoice-tts-windows-cpu
          path: out/*
